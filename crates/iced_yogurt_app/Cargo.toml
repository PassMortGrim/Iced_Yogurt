[package]
name = "iced_yogurt_app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "iced-yogurt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
iced = { version = "0.13", features = ["tokio"] }
iced_yogurt_audio = { path = "../iced_yogurt_audio", default-features = false }
iced_yogurt_core = { path = "../iced_yogurt_core" }
iced_yogurt_llm = { path = "../iced_yogurt_llm" }
iced_yogurt_stt = { path = "../iced_yogurt_stt", default-features = false }
tokio = { version = "1", features = ["time"] }
