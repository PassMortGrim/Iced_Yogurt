name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libclang1 libasound2-dev libudev-dev pkg-config llvm g++
      - name: Dépendances système (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config llvm
          brew install --cask xcode
      - name: Dépendances système (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --yes
          choco install llvm --yes
      - name: Build
        run: cargo build --workspace
      - name: Tests
        run: cargo test --workspace
