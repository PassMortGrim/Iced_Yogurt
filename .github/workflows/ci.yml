name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libclang1 libasound2-dev libudev-dev pkg-config llvm g++
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV
          echo "/usr/bin" >> $GITHUB_PATH
      - name: Dépendances système (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config llvm
          brew install --cask xcode
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
      - name: Dépendances système (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --yes
          choco install llvm --yes
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\lib" >> $GITHUB_ENV
      - name: Build
        run: |
          cargo build -p iced_yogurt_core
          cargo build -p iced_yogurt_audio
          cargo build -p iced_yogurt_llm
          cargo build -p iced_yogurt_stt --no-default-features --features ci
          cargo build -p iced_yogurt_app --no-default-features
      - name: Tests
        run: |
          cargo test -p iced_yogurt_core
          cargo test -p iced_yogurt_audio
          cargo test -p iced_yogurt_llm
          cargo test -p iced_yogurt_stt --no-default-features --features ci
          cargo test -p iced_yogurt_app --no-default-features
